[package]
name = "onecamp-desktop"
version = "1.1.0"
description = "OneCamp for the desktop"
authors = ["OneMana Solutions (OPC) Private Limited"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "onecamp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# On-device dictation (src/dictation.rs). ort is load-dynamic: ONNX Runtime is
# fetched on first use and loaded at run time, never linked, so the app starts
# without it on any CPU.
cpal = "0.16"
rubato = "0.16"
transcribe-rs = { version = "=0.3.8", default-features = false, features = ["onnx"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic"] }
ureq = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
